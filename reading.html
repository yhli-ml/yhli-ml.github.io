<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading · Yuhang Li</title>
  <meta name="description" content="Yuhang Li's reading notes: papers, posts and books, with short thoughts on each.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f2a24'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23f7f3ea'%3Eyl%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Yuhang Li</a>
    <nav>
      <a href="./#about">about</a>
      <a href="./#story">research</a>
      <a class="nav-papers" href="./#publications">papers</a>
      <a href="reading.html" aria-current="page">reading</a>
      <a href="https://github.com/yhli-ml/yhli-ml/blob/main/resume/Yuhang_Li_Research_Resume.pdf">cv</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-9.54-4.54A5.4 5.4 0 0 1 13.36 3.1C12.92 3.04 12.46 3 12 3Z"/></svg>
      </button>
    </nav>
  </header>

  <main class="reading">
    <h1>reading</h1>
    <p class="lede">Papers, posts and books I've read recently, with a few thoughts on each. Newest first.</p>

    <input class="search" id="rSearch" type="search" placeholder="Search titles and notes…" aria-label="Search reading notes">

    <div class="r-top">
      <aside class="card r-stats">
        <div class="label">stats</div>
        <div><span class="muted">total:</span> <span id="rTotal">0</span></div>
        <div><span class="muted">this month:</span> <span id="rMonth">0</span></div>
        <div><span class="muted">active days:</span> <span id="rDays">0</span></div>
      </aside>
      <div class="card r-filter">
        <div class="label">filter</div>
        <div class="chips" id="rChips"></div>
        <button type="button" class="ghost" id="rRandom">random entry ↻</button>
      </div>
    </div>

    <div class="card r-heat">
      <div class="r-heat-head">
        <span class="label">reading activity</span>
        <span class="muted small" id="rStreak"></span>
      </div>
      <div class="heat-scroll"><div class="heat" id="rHeat"></div></div>
    </div>

    <div id="rList" class="r-list" aria-live="polite"></div>
    <p id="rEmpty" class="r-empty" hidden></p>
  </main>

  <footer>
    <span>© <span id="year">2026</span> Yuhang Li</span>
    <span>Tokyo · last updated <span id="updated">Nov 2026</span></span>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="script.js"></script>
  <script src="reading.js"></script>
</body>
</html>
