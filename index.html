<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Yuhang Li — Ph.D. student at the University of Tokyo working on trustworthy machine learning and foundation models.">
  <meta property="og:title" content="Yuhang Li">
  <meta property="og:description" content="Ph.D. student at the University of Tokyo · trustworthy machine learning and foundation models.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f2a24'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23f7f3ea'%3Eyl%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Yuhang Li</a>
    <nav>
      <a href="./#about">about</a>
      <a href="./#story">research</a>
      <a class="nav-papers" href="./#publications">papers</a>
      <a href="reading.html">reading</a>
      <a href="https://github.com/yhli-ml/yhli-ml/blob/main/resume/Yuhang_Li_Research_Resume.pdf">cv</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-9.54-4.54A5.4 5.4 0 0 1 13.36 3.1C12.92 3.04 12.46 3 12 3Z"/></svg>
      </button>
    </nav>
  </header>

  <!-- All page text lives in home.md; home.js renders it here. -->
  <main id="home" aria-busy="true"></main>

  <!-- Interactive figures, inserted where home.md says "figure: <name>". -->
  <template id="fig-complementary-labels">
    <figure class="demo" id="demo-cll">
      <button class="hide-btn" type="button">hide</button>
      <div class="demo-body">
        <div class="seg" role="group" aria-label="Supervision mode">
          <button type="button" data-mode="cl" class="on">complementary label only</button>
          <button type="button" data-mode="plg">+ positive guess</button>
          <button type="button" data-mode="nle">+ negative enhancement</button>
        </div>
        <div class="cll-image">
          <div class="thumb" aria-hidden="true">?</div>
          <div class="cll-meta">
            <div class="small muted">an unlabeled training image</div>
            <div class="cll-tag">annotator says: <strong>not <span id="cllNot">airplane</span></strong></div>
            <button type="button" class="ghost" id="cllNew">new example ↻</button>
          </div>
        </div>
        <div class="bars" id="cllBars"></div>
        <figcaption id="cllCap"></figcaption>
        <p class="note">Toy illustration of the idea; bar heights are not taken from the paper.</p>
      </div>
    </figure>
  </template>

  <template id="fig-long-tail">
    <figure class="demo" id="demo-lt">
      <button class="hide-btn" type="button">hide</button>
      <div class="demo-body">
        <div class="controls">
          <label>imbalance ratio <output id="ltRatioOut">100</output>
            <input type="range" id="ltRatio" min="1" max="200" value="100">
          </label>
          <label>label noise <output id="ltNoiseOut">40%</output>
            <input type="range" id="ltNoise" min="0" max="60" value="40">
          </label>
        </div>
        <div class="lt-chart" id="ltChart" aria-label="Samples per class"></div>
        <div class="lt-experts" id="ltExperts">
          <span data-g="head">head expert</span><span data-g="med">medium expert</span><span data-g="tail">tail expert</span>
        </div>
        <div class="legend">
          <span><i class="sw clean"></i>clean</span>
          <span><i class="sw noisy"></i>mislabeled</span>
          <span><i class="sw borrow"></i>soft labels from related instances</span>
        </div>
        <div class="seg" role="group" aria-label="Method">
          <button type="button" data-on="0" class="on">baseline</button>
          <button type="button" data-on="1">+ semantic transfer &amp; experts</button>
        </div>
        <figcaption id="ltCap"></figcaption>
        <p class="note">Schematic: the class counts follow the standard exponential long-tail profile; the borrowed share is illustrative.</p>
      </div>
    </figure>
  </template>

  <template id="fig-kv-cache">
    <figure class="demo" id="demo-kv">
      <button class="hide-btn" type="button">hide</button>
      <div class="demo-body">
        <div class="seg" role="group" aria-label="Prefetch strategy">
          <button type="button" data-kv="native" class="on">native prefetch</button>
          <button type="button" data-kv="ours">arrival-triggered prefetch</button>
        </div>
        <div class="kv">
          <div class="kv-axis"><span>request arrives</span><span>time →</span></div>
          <div class="kv-row">
            <div class="kv-label">scheduler</div>
            <div class="kv-track">
              <div class="kv-bar queue" id="kvQueue">waiting in queue</div>
              <div class="kv-bar compute" id="kvPrefill">prefill</div>
            </div>
          </div>
          <div class="kv-row">
            <div class="kv-label">SSD → host</div>
            <div class="kv-track">
              <div class="kv-bar io" id="kvIO">load prefix KV</div>
            </div>
          </div>
          <div class="kv-row">
            <div class="kv-label">host → GPU</div>
            <div class="kv-track">
              <div class="kv-bar io2" id="kvH2D">copy</div>
            </div>
          </div>
          <div class="kv-ttft" id="kvTTFT"><span>TTFT</span></div>
        </div>
        <figcaption id="kvCap"></figcaption>
        <p class="note">Schematic timeline for a single request; the reported numbers come from the full replay.</p>
      </div>
    </figure>
  </template>

  <footer>
    <span>© <span id="year">2026</span> Yuhang Li</span>
    <span>Tokyo · last updated <span id="updated">Nov 2026</span></span>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="script.js"></script>
  <script src="home.js"></script>
</body>
</html>
